server {
    listen 80;
    server_name wzl136122.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name wzl136122.cn;

    ssl_certificate     /etc/nginx/ssl/wzl136122.cn/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/wzl136122.cn/privkey.pem;

    client_max_body_size 20m;

    # 通用安全响应头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ^~ /uploads/ {
        alias /www/wwwroot/wzl136122.cn/server/uploads/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; sandbox" always;

        # 兜底：上传目录永远不应出现脚本类文件。文件名已由服务端白名单生成，
        # 这里再加一道防线，避免任何可执行/可解析后缀被静态服务直接吐出去。
        location ~* \.(php|php5|php7|phtml|jsp|asp|aspx|sh|py|rb|pl|cgi|htaccess)$ {
            deny all;
        }

        try_files $uri $uri/ =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /pay_notify.php {
        proxy_pass http://127.0.0.1:3000/pay_notify.php;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
