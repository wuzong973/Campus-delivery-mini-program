server {
    listen 80;
    server_name wzl136122.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name wzl136122.cn;

    ssl_certificate     /etc/nginx/ssl/wzl136122.cn/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/wzl136122.cn/privkey.pem;

    client_max_body_size 20m;

    location ^~ /uploads/ {
        alias /www/wwwroot/wzl136122.cn/server/uploads/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri $uri/ =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /pay_notify.php {
        proxy_pass http://127.0.0.1:3000/pay_notify.php;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
